services:
  department-api-postgres:
    image: postgres:18.6
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./init-for-dev-only.sql:/docker-entrypoint-initdb.d/init-for-dev-only.sql
    network_mode: "bridge"

  hmpps-departments-api:
    image: ghcr.io/ministryofjustice/hmpps-departments-api:latest
    #networks:
      #- hmpps
    container_name: hmpps-departments-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ping"]
    depends_on: [department-api-postgres]
    environment:
      - SERVER_PORT=8080
      #- HMPPS_AUTH_URL=http://hmpps-auth:8080/auth
      - SPRING_PROFILES_ACTIVE=dev

  hmpps-auth:
    image: ghcr.io/ministryofjustice/hmpps-auth:latest
    networks:
      - hmpps
    container_name: hmpps-auth
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - APPLICATION_AUTHENTICATION_UI_ALLOWLIST=0.0.0.0/0

networks:
  hmpps:
